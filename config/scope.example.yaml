# ============================================================
# INOVA — périmètre autorisé (copier en scope.yaml et adapter)
# Aucun test n'est lancé hors de ce périmètre.
# ============================================================

authorization:
  client: "Client Démo"
  reference: "Lettre de mission LM-2026-014"
  signed_by: "RSSI du client"
  valid_from: "2026-11-01"
  valid_until: "2026-12-31"

pentest:
  type: "web_boite_grise"     # web_boite_noire | web_boite_grise | api | multi_applications
  authenticated: true
  custom_application: true    # application développée en interne
  exploitation_chaining: true # besoin d'enchaîner plusieurs failles
  data_classification: "interne"   # public | interne | confidentiel | secret
  sector: "assurance"

targets:
  domains: ["demo.inova-lab.local"]
  ip_ranges: ["10.10.0.0/24"]
  urls: ["https://demo.inova-lab.local"]

excluded:
  - "10.10.0.1"               # passerelle réseau du client : interdit

asset_criticality:            # pour la priorisation (impact métier)
  "demo.inova-lab.local": "haute"
  "10.10.0.20": "moyenne"

# Termes propres au client à TOUJOURS masquer (deny-list)
sensitive_terms:
  - "clients_cartes"
  - "intranet-demo"
  - "SinistresPro"
